<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>asPNG Demo</title>
  <style>
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 16px;
    }

    img,
    pre {
      max-width: 100%;
    }

    pre {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <section>
    <h2>Log</h2>
    <pre id="log">...</pre>
  </section>

  <hr />

  <section>
    <h2>Encode</h2>
    <label>Data</label>
    <br />
    <input id="encode_data" type="file" onchange="asPNG.encode(event)" />
    <br />
    <label>Preview</label>
    <br />
    <img id="encoded_out" alt="Image" />
  </section>

  <section>
    <h2>Decode</h2>
    <label>Image</label>
    <br />
    <input id="decode" type="file" onchange="asPNG.decode(event)" />
    <br />
    <a id="decoded_out" hidden>Download decoded data</a>
  </section>

  <hr />

  <section>
    <h2>Inject</h2>
    <label>Data</label>
    <br />
    <input id="inject_data" type="file" />
    <br />
    <label>Image</label>
    <br />
    <input id="inject_img" type="file" onchange="asPNG.inject(event)" />
    <br />
    <label>Preview</label>
    <br />
    <img id="injected_out" alt="Image" />
  </section>

  <section>
    <h2>Extract</h2>
    <label>Image</label>
    <br />
    <input id="extract" type="file" onchange="asPNG.extract(event)" />
    <br />
    <a id="extracted_out" hidden>Download extracted data</a>
  </section>

  <script src="main.js" type="module"></script>
</body>

</html>
